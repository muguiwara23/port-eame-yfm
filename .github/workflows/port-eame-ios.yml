name: Port/eame iOS

# Port/eame: the iOS ARM64 build, brought up one stage at a time on the
# port-eame/ios branch. No disc, no secrets and no signing identity are used.
# Run by hand only (Actions > Port/eame iOS > Run workflow): a push builds
# nothing, so one build at a time has the macOS runner.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: port-eame-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-compile:
    name: iOS build and unsigned IPA (macos-15)
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: |
            tmp/pc/llvm-macos
            tmp/pc/tools/macos
          key: port-eame-ios-llvm21.1.8-${{ hashFiles('tools/pc/macos_toolchain.json', 'tools/pc/fetch_tools.py') }}
      - name: Xcode and iOS SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version
      - name: Build and check zlib, libpng, FreeType and SDL3 for iOS ARM64
        run: python tools/pc/build_ios_deps.py
      - name: Compile and link the game for iOS ARM64 (no disc, no signing)
        run: |
          grep -E '^Libs' tmp/pc/ios-deps/install/lib/pkgconfig/sdl3.pc
          python tools/pc/build.py --target ios
      - name: Show why units failed
        if: failure()
        run: |
          shopt -s nullglob
          for log in tmp/pc/ios/logs/*.log; do
            [ -s "$log" ] || continue
            echo "::group::$(basename "$log")"
            head -n 120 "$log"
            echo "::endgroup::"
          done
      - name: Check the compiled objects are iOS ARM64
        run: |
          count=0
          for object in tmp/pc/ios/obj/*.o; do
            count=$((count + 1))
            xcrun otool -l "$object" | awk '/LC_BUILD_VERSION/{f=1} f&&/platform/{print $2; f=0}'
          done | sort | uniq -c
          echo "objects: $(ls tmp/pc/ios/obj/*.o | wc -l)"
          cat tmp/pc/ios/summary.json | python3 -c "import json,sys; d=json.load(sys.stdin); print('units', d['units'], 'failures', len(d['failures']))"
      - name: Check the linked executable is iOS ARM64
        run: |
          binary=tmp/pc/ios/memories-ios
          ls -l "$binary"
          xcrun lipo -info "$binary"
          xcrun otool -l "$binary" | awk '/LC_BUILD_VERSION/{f=1} f&&/(platform|minos|sdk)/{print} f&&/ntools/{f=0}'
          echo "linked libraries and frameworks:"
          xcrun otool -L "$binary" | tail -n +2
      - name: Package the unsigned IPA (no disc data, no signing identity)
        run: |
          python tools/pc/package_ios.py --version "0.3.0-ios-dev.${{ github.run_number }}"
          unzip -l tmp/pc-release/ios/*.ipa
          for library in "tmp/pc-release/ios/stage/Payload/YFM Re-Decomp.app"/mods/*/*.dylib; do
            echo "== $library"
            xcrun lipo -info "$library"
            xcrun otool -l "$library" | awk '/LC_BUILD_VERSION/{f=1} f&&/(platform|minos)/{print} f&&/ntools/{f=0}'
          done
          plutil -p "tmp/pc-release/ios/stage/Payload/YFM Re-Decomp.app/Info.plist"
      - uses: actions/upload-artifact@v4
        with:
          name: yfm-redecomp-ios-unsigned-ipa
          path: |
            tmp/pc-release/ios/*.ipa
            tmp/pc-release/ios/*.ipa.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Collect logs
        if: always()
        run: |
          mkdir -p tmp/port-eame-report
          ls -l tmp/pc/ios-deps/install/lib > tmp/port-eame-report/libraries.txt 2>&1 || true
          cp tmp/pc/ios/summary.json tmp/pc/ios/link-command.json tmp/pc/ios/build-identity.json tmp/port-eame-report/ 2>/dev/null || true
          mkdir -p tmp/port-eame-report/logs
          find tmp/pc/ios/logs -name '*.log' -size +0 -exec cp {} tmp/port-eame-report/logs/ \; 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: port-eame-ios-report
          path: tmp/port-eame-report
          if-no-files-found: warn
          retention-days: 14
